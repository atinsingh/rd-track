[package]
name = "rd-agent"
description = "RoundDigital Track desktop agent (headless binary and developer CLI)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "rd-agent"
path = "src/main.rs"

[features]
default = []
## Store the device credential and outbox key in the OS keychain (`keyring` crate)
## instead of 0600 files in the data directory.
keychain = ["dep:keyring"]

[dependencies]
keyring = { workspace = true, optional = true }
rd-agent-core = { path = "../rd-agent-core" }
chrono.workspace = true
clap.workspace = true
ctrlc.workspace = true
env_logger.workspace = true
log.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
