[package]
name = "rd-agent-desktop"
description = "RoundDigital Track desktop agent: tray app (Tauri 2) around rd-agent-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Tauri 2 and its dependency tree need a newer compiler than the core crates.
rust-version = "1.85"
default-run = "rd-agent-desktop"

[[bin]]
name = "rd-agent-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rd-agent-core = { path = "../rd-agent-core" }
rd-agent = { path = "../rd-agent", features = ["keychain"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2.14"
tauri-plugin-opener = "2.7"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
chrono.workspace = true
env_logger.workspace = true
log.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
