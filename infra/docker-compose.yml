# Local development services. `docker compose -f infra/docker-compose.yml up -d`
services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: rd
      POSTGRES_PASSWORD: rd
      POSTGRES_DB: rd_track
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rd"]
      interval: 5s
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rdtrack
      MINIO_ROOT_PASSWORD: rdtrack-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 rdtrack rdtrack-dev-secret &&
      mc mb --ignore-existing local/rd-track-dev &&
      mc anonymous set none local/rd-track-dev"
volumes:
  pgdata:
  minio:
